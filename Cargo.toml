[package]
name = "PathSched"
version = "0.1.0"
edition = "2024"

[lib]
name = "pathsched"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
include_dir = "0.7"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
